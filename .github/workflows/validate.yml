name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontmatter, links, terminology
        run: python tools/validate.py .

  skills-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skills-ref (official reference validator, pinned)
        run: pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate skill
        run: skills-ref validate skills/x-ray

  plugin-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code (pinned; validate needs no credentials)
        run: npm install -g @anthropic-ai/claude-code@2.1.131
      - name: Validate plugin and marketplace manifests
        run: |
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate .
