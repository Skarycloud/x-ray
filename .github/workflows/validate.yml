name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The skill directory name must match `name: x-ray` in SKILL.md.
          path: x-ray
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontmatter, links, terminology
        run: python tools/validate.py .
        working-directory: x-ray

  skills-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: x-ray
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skills-ref (official reference validator, pinned)
        run: pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate skill
        run: skills-ref validate x-ray
